name: benrica
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0-15.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.1
  shared_preferences: ^2.0.7
  json_annotation: ^4.1.0
  syncfusion_flutter_calendar: ^21.2.3
  intl: ^0.18.1
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.0.7
  cached_network_image: ^3.0.0
  url_launcher: ^6.1.14
  flutter_launcher_icons: ^0.9.3
  go_router: ^13.0.0
  provider: ^5.0.0
  get_it: ^7.6.7
  dio: ^5.4.3+1


flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/benrica_app_icon.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/icons/benrica_app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
   

dev_dependencies:
  json_serializable: ^4.1.4
  build_runner: ^2.1.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/benrica_logo.png
    - assets/logo/benrica_website_icon.png
    - assets/icons/benrica_app_icon.png
    - assets/icons/facebook.png
    - assets/icons/instagram.png
    - assets/icons/tiktok.png
    - assets/icons/whatsapp.png
